name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      - name: sing-box merge tests
        run: python3 -m unittest tests/test_sing_box_merge.py tests/test_google_stable_route.py
      - name: Deployment script syntax
        run: bash -n deploy/*.sh && python3 -m json.tool configs/sing-box-deployment.example.json >/dev/null
      - name: Static build
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Loss recovery integration test
        env:
          SMART_FEC_BIN: ./target/x86_64-unknown-linux-musl/release/smart-fec-tunnel
        run: python3 tests/integration_loopback.py
      - name: Multi-user isolation integration test
        env:
          SMART_FEC_BIN: ./target/x86_64-unknown-linux-musl/release/smart-fec-tunnel
        run: python3 tests/integration_multiuser.py
      - name: QUIC carrier integration and reconnect test
        env:
          BIN: ./target/x86_64-unknown-linux-musl/release/smart-fec-tunnel
        run: chmod +x tests/integration_quic_relay.sh && tests/integration_quic_relay.sh
      - uses: actions/upload-artifact@v4
        with:
          name: smart-fec-tunnel-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/smart-fec-tunnel
