name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Format
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      - name: Static build
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Loss recovery integration test
        env:
          SMART_FEC_BIN: ./target/x86_64-unknown-linux-musl/release/smart-fec-tunnel
        run: python3 tests/integration_loopback.py
      - uses: actions/upload-artifact@v4
        with:
          name: smart-fec-tunnel-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/smart-fec-tunnel

